<!DOCTYPE html>

<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>📦 Stock RP</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
font-family:"Segoe UI",sans-serif;
background:radial-gradient(circle at top,#0d1117,#05080f);
color:white;
min-height:100vh;
}

header{
text-align:center;
padding:25px;
}

header h1{
font-size:30px;
letter-spacing:2px;
}

.top-bar{
width:90%;
max-width:1000px;
margin:auto;
display:flex;
gap:10px;
margin-bottom:20px;
}

.search{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#161b22;
color:white;
outline:none;
}

.new-btn{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2ea043;
color:white;
font-weight:bold;
cursor:pointer;
}

.new-btn:hover{
opacity:.9;
}

.container{
padding:20px;
display:grid;
grid-template-columns:repeat(auto-fill,minmax(220px,1fr));
gap:15px;
}

.card{
position:relative;
background:linear-gradient(145deg,#161b22,#0d1117);
border:1px solid #30363d;
border-radius:15px;
padding:15px;
text-align:center;
transition:.3s;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 15px rgba(255,255,255,.08);
}

.card h3{
margin-bottom:10px;
word-break:break-word;
}

.qty{
font-size:32px;
font-weight:bold;
color:#ffb86c;
margin:15px 0;
}

.actions{
display:flex;
justify-content:center;
flex-wrap:wrap;
gap:5px;
}

button{
border:none;
border-radius:8px;
padding:8px 12px;
cursor:pointer;
color:white;
transition:.2s;
}

button:hover{
transform:scale(1.05);
}

.add{
background:#2ea043;
}

.remove{
background:#da3633;
}

.edit{
background:#58a6ff;
}

.delete-top{
position:absolute;
top:8px;
right:10px;
font-size:18px;
cursor:pointer;
color:#ff4d4d;
}

.delete-top:hover{
transform:scale(1.2);
}

</style>

</head>

<body>

<header>
<h1>📦 STOCK RP</h1>
</header>

<div class="top-bar">

<input
type="text"
id="search"
class="search"
placeholder="🔎 Rechercher une ressource..."

>

<button
id="addResource"
class="new-btn"

>

➕ Ressource </button>

</div>

<div id="list" class="container"></div>

<script type="module">

import { initializeApp }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
doc,
updateDoc,
deleteDoc,
onSnapshot,
increment
}
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ======================
   FIREBASE
====================== */

const firebaseConfig = {

apiKey:"TON_API_KEY",
authDomain:"TON_DOMAIN",
projectId:"TON_PROJECT_ID"

};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ======================
   DOM
====================== */

const list = document.getElementById("list");
const search = document.getElementById("search");
const addResourceBtn = document.getElementById("addResource");

let resources = [];

/* ======================
   FIRESTORE LIVE
====================== */

onSnapshot(
collection(db,"stock"),
(snapshot)=>{

resources=[];

snapshot.forEach(docSnap=>{

resources.push({
id:docSnap.id,
...docSnap.data()
});

});

resources.sort((a,b)=>
(a.name || "")
.localeCompare(
(b.name || ""),
"fr"
)
);

render();

}
);

/* ======================
   SECURITE
====================== */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* ======================
   AFFICHAGE
====================== */

function render(){

const filter =
search.value.toLowerCase();

const html = resources

.filter(item =>
(item.name || "")
.toLowerCase()
.includes(filter)
)

.map(item => `

<div class="card">

<div
class="delete-top"
onclick="deleteItem('${item.id}')"
title="Supprimer"
>
✕
</div>

<h3>
${escapeHtml(item.name)}
</h3>

<div class="qty">
${item.qty || 0}
</div>

<div class="actions">

<button
class="add"
onclick="addQty('${item.id}')"
>
➕
</button>

<button
class="remove"
onclick="removeQty('${item.id}')"
>
➖
</button>

<button
class="edit"
onclick="editQty('${item.id}',${item.qty || 0})"
>
✏️
</button>

</div>

</div>

`)

.join("");

list.innerHTML = html;

}

/* ======================
   AJOUT QUANTITE
====================== */



   window.addQty = async (id) => {

const amount = parseInt(
prompt("Combien veux-tu ajouter ?", "1")
);

if (isNaN(amount) || amount <= 0) return;

try {

await updateDoc(
doc(db, "stock", id),
{
qty: increment(amount)
}
);

} catch (error) {
console.error(error);
}

};


   
/* ======================
   RETRAIT QUANTITE
====================== */

window.removeQty = async(id)=>{

const item =
resources.find(
r => r.id === id
);

if(!item){
return;
}

const amount = parseInt(
prompt(
"Combien retirer ?",
"1"
)
);

if(isNaN(amount) || amount <= 0){
return;
}

const newQty = Math.max(
0,
(item.qty || 0) - amount
);

try{

await updateDoc(
doc(db,"stock",id),
{
qty:newQty
}
);

}catch(error){

console.error(error);

}

};

/* ======================
   MODIFIER QUANTITE
====================== */

window.editQty = async(
id,
currentQty
)=>{

const value = prompt(
"Nouvelle quantité :",
currentQty
);

if(value === null){
return;
}

let qty = parseInt(value);

if(isNaN(qty)){
qty = 0;
}

qty = Math.max(0,qty);

try{

await updateDoc(
doc(db,"stock",id),
{
qty
}
);

}catch(error){

console.error(error);

}

};

/* ======================
   SUPPRIMER
====================== */

window.deleteItem = async(id)=>{

if(
!confirm(
"Supprimer cette ressource ?"
)
){
return;
}

try{

await deleteDoc(
doc(db,"stock",id)
);

}catch(error){

console.error(error);

}

};

/* ======================
   AJOUT RESSOURCE
====================== */

addResourceBtn
.addEventListener(
"click",
async()=>{

const name = prompt(
"Nom de la ressource :"
);

if(
!name ||
!name.trim()
){
return;
}

try{

await addDoc(
collection(db,"stock"),
{
name:name.trim(),
qty:0
}
);

}catch(error){

console.error(error);

}

}
);

/* ======================
   RECHERCHE
====================== */

search.addEventListener(
"input",
render
);

</script>

</body>
</html>
