<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Stock RP</title>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getFirestore, collection, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "TON_API_KEY",
  authDomain: "TON_DOMAIN",
  projectId: "TON_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

window.db = db;
</script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: radial-gradient(circle at top, #0d1117, #05080f);
  color: white;
  font-family: "Segoe UI", sans-serif;
}

/* HEADER */
header {
  text-align: center;
  padding: 25px;
}

header h1 {
  font-size: 28px;
  letter-spacing: 2px;
}

/* SEARCH */
.search {
  width: 80%;
  margin: auto;
  display: block;
  padding: 12px;
  border-radius: 10px;
  border: none;
  background: #161b22;
  color: white;
  margin-bottom: 20px;
}

/* GRID */
.container {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
  gap: 15px;
  padding: 20px;
}

/* CARD */
.card {
  background: linear-gradient(145deg, #161b22, #0d1117);
  border-radius: 15px;
  padding: 15px;
  text-align: center;
  border: 1px solid #30363d;
  transition: 0.3s;
  position: relative;
}

.card:hover {
  transform: translateY(-5px);
  box-shadow: 0 0 15px rgba(255,255,255,0.05);
}

.card h3 {
  font-size: 16px;
  margin-bottom: 10px;
}

/* QTY */
.qty {
  font-size: 26px;
  color: #ffb86c;
  margin: 10px 0;
}

/* BUTTONS */
.actions {
  display: flex;
  justify-content: center;
  flex-wrap: wrap;
}

button {
  border: none;
  padding: 6px 10px;
  margin: 3px;
  border-radius: 6px;
  cursor: pointer;
  transition: 0.2s;
}

.add { background: #2ea043; }
.remove { background: #da3633; }
.edit { background: #58a6ff; }
.delete { background: #8b0000; }

button:hover {
  transform: scale(1.1);
}

/* DELETE ICON */
.delete-top {
  position: absolute;
  top: 8px;
  right: 8px;
  cursor: pointer;
  color: #ff4d4d;
}
</style>
</head>

<body>

<header>
  <h1>📦 STOCK RP</h1>
</header>

<input class="search" id="search" placeholder="🔎 Rechercher une ressource...">

<div class="container" id="list"></div>

<script type="module">

import { db } from "./index.html";
import { collection, doc, updateDoc, deleteDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

const list = document.getElementById("list");
const search = document.getElementById("search");

let resources = [];

onSnapshot(collection(db, "stock"), (snap) => {
  resources = [];
  snap.forEach(d => {
    resources.push({ id: d.id, ...d.data() });
  });
  render();
});

function render() {
  list.innerHTML = "";

  const filter = search.value.toLowerCase();

  resources
    .filter(r => r.name.toLowerCase().includes(filter))
    .forEach(r => {

      list.innerHTML += `
      <div class="card">
        <div class="delete-top" onclick="deleteItem('${r.id}')">✕</div>

        <h3>${r.name}</h3>
        <div class="qty">${r.qty}</div>

        <div class="actions">
          <button class="add" onclick="add('${r.id}')">+</button>
          <button class="remove" onclick="removeQty('${r.id}')">-</button>
          <button class="edit" onclick="editQty('${r.id}', ${r.qty})">✏️</button>
        </div>
      </div>
      `;
    });
}

window.add = async (id) => {
  let item = resources.find(r => r.id === id);
  await updateDoc(doc(db, "stock", id), { qty: item.qty + 1 });
};

window.removeQty = async (id) => {
  let item = resources.find(r => r.id === id);
  if(item.qty > 0)
    await updateDoc(doc(db, "stock", id), { qty: item.qty - 1 });
};

window.editQty = async (id, val) => {
  let n = prompt("Nouvelle quantité :", val);
  if(n !== null)
    await updateDoc(doc(db, "stock", id), { qty: parseInt(n) || 0 });
};

window.deleteItem = async (id) => {
  await deleteDoc(doc(db, "stock", id));
};

search.addEventListener("input", render);

</script>

</body>
</html>
