<!DOCTYPE html>
<html lang="fr">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Stock RP</title>

<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}

body{
background:radial-gradient(circle at top,#0d1117,#05080f);
color:white;
font-family:"Segoe UI",sans-serif;
min-height:100vh;
}

header{
text-align:center;
padding:25px;
}

header h1{
font-size:28px;
letter-spacing:2px;
}

.top-bar{
display:flex;
gap:10px;
width:80%;
margin:auto;
margin-bottom:20px;
}

.search{
flex:1;
padding:12px;
border:none;
border-radius:10px;
background:#161b22;
color:white;
}

.new-btn{
padding:12px 18px;
border:none;
border-radius:10px;
background:#2ea043;
color:white;
cursor:pointer;
font-weight:bold;
}

.new-btn:hover{
opacity:.9;
}

.container{
display:grid;
grid-template-columns:repeat(auto-fill,minmax(180px,1fr));
gap:15px;
padding:20px;
}

.card{
background:linear-gradient(145deg,#161b22,#0d1117);
border-radius:15px;
padding:15px;
text-align:center;
border:1px solid #30363d;
transition:.3s;
position:relative;
}

.card:hover{
transform:translateY(-5px);
box-shadow:0 0 15px rgba(255,255,255,.05);
}

.card h3{
margin-bottom:10px;
word-break:break-word;
}

.qty{
font-size:28px;
color:#ffb86c;
margin:10px 0;
font-weight:bold;
}

.actions{
display:flex;
justify-content:center;
flex-wrap:wrap;
}

button{
border:none;
padding:6px 10px;
margin:3px;
border-radius:6px;
cursor:pointer;
transition:.2s;
color:white;
}

.add{
background:#2ea043;
}

.remove{
background:#da3633;
}

.edit{
background:#58a6ff;
}

.delete-top{
position:absolute;
top:8px;
right:8px;
cursor:pointer;
color:#ff4d4d;
font-size:18px;
}

button:hover{
transform:scale(1.05);
}
</style>
</head>

<body>

<header>
<h1>📦 STOCK RP</h1>
</header>

<div class="top-bar">
<input
class="search"
id="search"
placeholder="🔎 Rechercher une ressource..."
>
<button class="new-btn" id="addResource">
➕ Ressource
</button>
</div>

<div class="container" id="list"></div>

<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";

import {
getFirestore,
collection,
addDoc,
doc,
updateDoc,
deleteDoc,
onSnapshot,
increment
} from "https://www.gstatic.com/firebasejs/10.7.1/firebase-firestore.js";

/* ===========================
   FIREBASE CONFIG
   =========================== */

const firebaseConfig = {
apiKey: "TON_API_KEY",
authDomain: "TON_DOMAIN",
projectId: "TON_PROJECT_ID"
};

const app = initializeApp(firebaseConfig);
const db = getFirestore(app);

/* ===========================
   DOM
   =========================== */

const list = document.getElementById("list");
const search = document.getElementById("search");
const addResourceBtn = document.getElementById("addResource");

let resources = [];

/* ===========================
   FIRESTORE LIVE
   =========================== */

onSnapshot(collection(db,"stock"),(snapshot)=>{

resources = [];

snapshot.forEach(docSnap=>{
resources.push({
id: docSnap.id,
...docSnap.data()
});
});

resources.sort((a,b)=>
a.name.localeCompare(b.name,"fr")
);

render();

});

/* ===========================
   RENDER
   =========================== */

function render(){

const filter = search.value.toLowerCase();

const html = resources
.filter(item =>
item.name.toLowerCase().includes(filter)
)
.map(item => `
<div class="card">

<div
class="delete-top"
onclick="deleteItem('${item.id}')"
title="Supprimer"
>
✕
</div>

<h3>${escapeHtml(item.name)}</h3>

<div class="qty">
${item.qty ?? 0}
</div>

<div class="actions">

<button
class="add"
onclick="addQty('${item.id}')"
>
+
</button>

<button
class="remove"
onclick="removeQty('${item.id}')"
>
-
</button>

<button
class="edit"
onclick="editQty('${item.id}',${item.qty ?? 0})"
>
✏️
</button>

</div>

</div>
`)
.join("");

list.innerHTML = html;

}

/* ===========================
   SECURITE HTML
   =========================== */

function escapeHtml(text){

return String(text)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}

/* ===========================
   ACTIONS
   =========================== */

window.addQty = async(id)=>{

try{

await updateDoc(
doc(db,"stock",id),
{
qty: increment(1)
}
);

}catch(error){

console.error(error);

}

};

window.removeQty = async(id)=>{

const item = resources.find(r=>r.id===id);

if(!item || item.qty <= 0){
return;
}

try{

await updateDoc(
doc(db,"stock",id),
{
qty: increment(-1)
}
);

}catch(error){

console.error(error);

}

};

window.editQty = async(id,currentQty)=>{

const value = prompt(
"Nouvelle quantité :",
currentQty
);

if(value === null){
return;
}

let qty = parseInt(value);

if(isNaN(qty)){
qty = 0;
}

qty = Math.max(0,qty);

try{

await updateDoc(
doc(db,"stock",id),
{
qty
}
);

}catch(error){

console.error(error);

}

};

window.deleteItem = async(id)=>{

if(!confirm("Supprimer cette ressource ?")){
return;
}

try{

await deleteDoc(
doc(db,"stock",id)
);

}catch(error){

console.error(error);

}

};

/* ===========================
   AJOUT RESSOURCE
   =========================== */

addResourceBtn.addEventListener(
"click",
async()=>{

const name = prompt(
"Nom de la ressource :"
);

if(!name){
return;
}

try{

await addDoc(
collection(db,"stock"),
{
name: name.trim(),
qty: 0
}
);

}catch(error){

console.error(error);

}

}
);

/* ===========================
   RECHERCHE
   =========================== */

search.addEventListener(
"input",
render
);

</script>

</body>
</html>
